name: Publish DSH runner Node

# Windows DSH 沙箱用的 Node 24 zip：不进安装包。
# 打到独立 tag `dsh-runner-node`，再由 sync-atomgit 同步到 AtomGit。
# Node 补丁版本不变时不必每次应用发版都重跑。

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack-and-upload:
    name: Pack Node 24 sidecar and upload
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0

      - name: Pack both Windows arches
        run: node scripts/pack-dsh-runner-node.mjs --arch x64 && node scripts/pack-dsh-runner-node.mjs --arch arm64

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          TAG=dsh-runner-node
          NOTES="Windows DSH sandbox Node 24 (console node.exe). Not bundled in the installer; clients download on demand via AtomGit/GitHub."
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-runtime/dsh-runner-node/*.zip dist-runtime/dsh-runner-node/dsh-runner-node-releases.json --clobber --repo "${{ github.repository }}"
          else
            gh release create "$TAG" dist-runtime/dsh-runner-node/*.zip dist-runtime/dsh-runner-node/dsh-runner-node-releases.json --notes "$NOTES" --repo "${{ github.repository }}"
          fi
